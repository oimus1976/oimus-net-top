<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>oimus.net</title>
<meta name="description" content="oimus.net — live AI news feed">
<meta name="theme-color" content="#04060c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #04060c;
    --ink: #e8eeff;
    --muted: #8590b0;
    --line: rgba(140, 170, 255, .18);
    --glass: rgba(14, 20, 40, .62);
    --cyan: #5ee7ff;
    --violet: #b48cff;
    --pink: #ff7aa8;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans JP", system-ui, sans-serif;
    overflow-x: hidden;
  }
  a { color: inherit; }
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
  .vignette {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 35%, rgba(0,0,0,.8) 100%);
  }
  .scan {
    position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: .06;
    background: repeating-linear-gradient(0deg, #fff 0 1px, transparent 1px 3px);
  }

  .page { position: relative; z-index: 2; min-height: 100vh; display: flex; flex-direction: column; }

  header.hud {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
    padding: 28px max(16px, 4vw) 0;
    font-family: var(--mono);
  }
  .brand .tag { color: var(--muted); font-size: 12px; letter-spacing: .12em; }
  .brand h1 {
    margin: 6px 0 0; font-size: clamp(36px, 7vw, 72px); font-weight: 600; letter-spacing: .02em; line-height: 1;
    background: linear-gradient(90deg, #fff 10%, var(--cyan) 55%, var(--violet));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 24px rgba(94, 231, 255, .25));
  }
  .brand h1 .cur { color: var(--cyan); -webkit-text-fill-color: var(--cyan); animation: blink 1.1s steps(1) infinite; }
  .clock { text-align: right; }
  .clock .time { font-size: clamp(22px, 3.4vw, 34px); color: var(--cyan); text-shadow: 0 0 18px rgba(94,231,255,.5); }
  .clock .date { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .status { font-size: 11px; color: var(--muted); margin-top: 10px; }
  .status .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #6dffb0; box-shadow: 0 0 8px #6dffb0; margin-right: 6px; animation: pulse 2s infinite; }
  .status.err .dot { background: var(--pink); box-shadow: 0 0 8px var(--pink); }

  /* 3D ring of headline cards */
  .arena {
    flex: 1; position: relative;
    display: flex; align-items: center; justify-content: center;
    min-height: 460px;
    perspective: 1600px;
    perspective-origin: 50% 40%;
  }
  .ring {
    position: relative; width: 300px; height: 190px;
    transform-style: preserve-3d;
  }
  .card {
    position: absolute; inset: 0;
    padding: 18px 20px;
    border-radius: 14px;
    background: var(--glass);
    border: 1px solid var(--line);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    text-decoration: none;
    display: flex; flex-direction: column; justify-content: space-between;
    backface-visibility: hidden;
    transition: border-color .3s, box-shadow .3s, background .3s;
  }
  .card::after {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; border-radius: 14px 14px 0 0;
    background: linear-gradient(90deg, transparent, var(--c, var(--cyan)), transparent); opacity: .8;
  }
  .card:hover, .card:focus-visible {
    border-color: color-mix(in srgb, var(--c, var(--cyan)) 70%, transparent);
    box-shadow: 0 0 40px -6px color-mix(in srgb, var(--c, var(--cyan)) 60%, transparent);
    background: rgba(20, 30, 60, .85);
    outline: none;
  }
  .card .meta { font-family: var(--mono); font-size: 11px; color: var(--c, var(--cyan)); display: flex; justify-content: space-between; gap: 8px; }
  .card h3 { margin: 10px 0; font-size: 16px; line-height: 1.45; font-weight: 700;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .card .foot { font-family: var(--mono); font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
  .card .foot .host { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .hint { position: absolute; bottom: 8px; left: 0; right: 0; text-align: center; font-family: var(--mono); font-size: 11px; color: var(--muted); }

  /* Ticker */
  .ticker {
    position: relative; overflow: hidden;
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    background: rgba(8, 12, 26, .75);
    font-family: var(--mono); font-size: 13px;
  }
  .ticker .label {
    position: absolute; left: 0; top: 0; bottom: 0; z-index: 1;
    display: flex; align-items: center; padding: 0 28px 0 14px;
    background: linear-gradient(90deg, var(--bg) 70%, transparent);
    color: var(--pink); font-weight: 600; letter-spacing: .1em;
  }
  .ticker .track { display: inline-flex; white-space: nowrap; padding: 12px 0; animation: marquee var(--dur, 90s) linear infinite; }
  .ticker:hover .track { animation-play-state: paused; }
  .ticker a { text-decoration: none; margin-right: 48px; color: var(--ink); }
  .ticker a:hover { color: var(--cyan); }
  .ticker a .pts { color: var(--cyan); margin-right: 8px; }

  footer.hud {
    display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    padding: 14px max(16px, 4vw) 20px;
    font-family: var(--mono); font-size: 11px; color: var(--muted);
  }

  /* Phones: flat list instead of the ring */
  @media (max-width: 760px) {
    header.hud { flex-direction: column; }
    .clock { text-align: left; }
    .arena { perspective: none; min-height: 0; padding: 24px 16px; display: block; }
    .ring { width: auto; height: auto; transform: none !important; display: grid; gap: 12px; }
    .card { position: relative; inset: auto; transform: none !important; min-height: 150px; }
    .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .ticker .track { animation: none; }
    .brand h1 .cur, .status .dot { animation: none; }
  }

  @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes pulse { 50% { opacity: .3; } }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="vignette"></div>
<div class="scan"></div>

<div class="page">
  <header class="hud">
    <div class="brand">
      <div class="tag">// SIGNAL FEED — ARTIFICIAL INTELLIGENCE</div>
      <h1>oimus.net<span class="cur">_</span></h1>
      <div class="status" id="status"><span class="dot"></span>CONNECTING…</div>
    </div>
    <div class="clock">
      <div class="time" id="time">--:--:--</div>
      <div class="date" id="date"></div>
    </div>
  </header>

  <main class="arena" id="arena">
    <div class="ring" id="ring" aria-label="AI news headlines"></div>
    <div class="hint">drag to spin · click to read</div>
  </main>

  <div class="ticker" aria-label="Latest AI headlines">
    <div class="label">LIVE</div>
    <div class="track" id="track"></div>
  </div>

  <footer class="hud">
    <span>source: ITmedia AI+ / AINOW / Google ニュース / Publickey / GIGAZINE / Hacker News</span>
    <span>© oimus.net</span>
  </footer>
</div>

<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const pad = n => String(n).padStart(2, '0');

  // Clock
  const tEl = document.getElementById('time'), dEl = document.getElementById('date');
  const days = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const tick = () => {
    const n = new Date();
    tEl.textContent = `${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`;
    dEl.textContent = `${n.getFullYear()}.${pad(n.getMonth()+1)}.${pad(n.getDate())} ${days[n.getDay()]}`;
  };
  tick(); setInterval(tick, 1000);

  // ---- News ----
  const QUERIES = ['AI', 'LLM', 'OpenAI', 'Anthropic', 'Claude', 'Gemini', 'GPT', 'machine learning'];
  const TOPIC = /\b(AI|AGI|LLMs?|GPTs?|ChatGPT|OpenAI|Anthropic|Claude|Gemini|DeepMind|Llama|Mistral|Copilot|agents?|agentic|neural|transformers?|inference|machine learning|deep learning|diffusion|chatbots?|RAG|MCP)\b/i;
  const COLORS =['#5ee7ff', '#b48cff', '#ff7aa8', '#6dffb0', '#ffd166'];
  const ring = document.getElementById('ring'), track = document.getElementById('track'), status = document.getElementById('status');

  const ago = ts => {
    const m = Math.max(1, Math.round((Date.now() / 1000 - ts) / 60));
    return m < 60 ? `${m}m ago` : m < 1440 ? `${Math.round(m / 60)}h ago` : `${Math.round(m / 1440)}d ago`;
  };
  const host = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return 'news.ycombinator.com'; } };
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // English: Hacker News, ranked by points
  async function loadEn() {
    const since = Math.floor(Date.now() / 1000) - 3 * 86400;
    const urls = QUERIES.map(q =>
      `https://hn.algolia.com/api/v1/search?tags=story&query=${encodeURIComponent(q)}&numericFilters=created_at_i>${since},points>15&hitsPerPage=20`);
    const res = await Promise.allSettled(urls.map(u => fetch(u).then(r => r.ok ? r.json() : Promise.reject(r.status))));
    const seen = new Map();
    for (const r of res) if (r.status === 'fulfilled') for (const h of r.value.hits) if (h.title && TOPIC.test(h.title)) seen.set(h.objectID, h);
    return [...seen.values()].sort((a, b) => b.points - a.points).slice(0, 8).map(h => ({
      title: h.title, url: h.url || `https://news.ycombinator.com/item?id=${h.objectID}`,
      source: host(h.url), ts: h.created_at_i, badge: `▲ ${h.points}`, lang: 'EN'
    }));
  }

  // Japanese: JSON built every 30 min by GitHub Actions (scripts/build_news.py), newest first.
  // Local preview reads the copy next to the page instead.
  const JA_FEED = location.hostname === '127.0.0.1' || location.hostname === 'localhost'
    ? 'news-ja.json'
    : 'https://oimus1976.github.io/oimus-net-top/news-ja.json';
  async function loadJa() {
    const r = await fetch(JA_FEED, { cache: 'no-cache' });
    if (!r.ok) return [];
    const d = await r.json();
    return d.items.filter(it => /^https?:\/\//.test(it.url)).slice(0, 8).map(it => ({ ...it, badge: 'JP', lang: 'JP' }));
  }

  async function load() {
    const [ja, en] = await Promise.allSettled([loadJa(), loadEn()]).then(rs => rs.map(r => r.status === 'fulfilled' ? r.value : []));
    const out = [];
    for (let i = 0; i < Math.max(ja.length, en.length); i++) { if (ja[i]) out.push(ja[i]); if (en[i]) out.push(en[i]); }
    if (!out.length) throw new Error('no data');
    return { items: out, ja: ja.length, en: en.length };
  }

  let items = [];
  function render() {
    const n = items.length;
    ring.innerHTML = items.map((h, i) => `<a class="card" href="${esc(h.url)}" target="_blank" rel="noopener" style="--c:${COLORS[i % COLORS.length]}">
        <div class="meta"><span>#${pad(i + 1)} · ${h.lang}</span><span>${esc(h.badge)}</span></div>
        <h3 lang="${h.lang === 'JP' ? 'ja' : 'en'}">${esc(h.title)}</h3>
        <div class="foot"><span class="host">${esc(h.source)}</span><span>${ago(h.ts)}</span></div>
      </a>`).join('');
    layoutRing();

    const line = items.map(h =>
      `<a href="${esc(h.url)}" target="_blank" rel="noopener"><span class="pts">${esc(h.badge)}</span>${esc(h.title)}</a>`).join('');
    track.innerHTML = line + line;
    track.style.setProperty('--dur', `${Math.max(40, n * 7)}s`);
  }

  async function refresh() {
    try {
      const got = await load();
      items = got.items;
      render();
      status.className = 'status';
      const n = new Date();
      status.innerHTML = `<span class="dot"></span>LIVE · JP ${got.ja} / EN ${got.en} · SYNC ${pad(n.getHours())}:${pad(n.getMinutes())}`;
    } catch {
      status.className = 'status err';
      status.innerHTML = `<span class="dot"></span>OFFLINE · ニュースを取得できませんでした`;
    }
  }
  refresh(); setInterval(refresh, 10 * 60 * 1000);

  // ---- 3D ring ----
  const arena = document.getElementById('arena');
  const flat = () => matchMedia('(max-width: 760px)').matches;
  let radius = 600;
  function layoutRing() {
    const cards = ring.children, n = cards.length;
    if (!n || flat()) return;
    radius = Math.round((300 + 28) / (2 * Math.tan(Math.PI / n)));
    [...cards].forEach((c, i) => { c.style.transform = `rotateY(${(360 / n) * i}deg) translateZ(${radius}px)`; });
  }
  addEventListener('resize', layoutRing);

  let angle = 0, vel = 0, tilt = -8, dragging = false, lastX = 0, moved = 0, hover = false;
  arena.addEventListener('pointerdown', e => { if (flat()) return; dragging = true; moved = 0; lastX = e.clientX; });
  addEventListener('pointerup', () => { dragging = false; });
  addEventListener('pointermove', e => {
    if (!flat()) tilt = -8 + (e.clientY / innerHeight - .5) * -10;
    if (!dragging) return;
    const dx = e.clientX - lastX; lastX = e.clientX; moved += Math.abs(dx);
    angle += dx * 0.25; vel = dx * 0.05;
  });
  // Swallow the click that ends a drag so spinning doesn't open a link
  ring.addEventListener('click', e => { if (moved > 6) e.preventDefault(); }, true);
  ring.addEventListener('pointerenter', () => hover = true);
  ring.addEventListener('pointerleave', () => hover = false);

  function spin() {
    if (!flat()) {
      if (!dragging) {
        const cruise = reduce ? 0 : -0.06;
        vel += ((hover ? 0 : cruise) - vel) * 0.03;
        angle += vel;
      }
      ring.style.transform = `translateZ(${-radius}px) rotateX(${tilt.toFixed(2)}deg) rotateY(${angle.toFixed(2)}deg)`;
    }
    requestAnimationFrame(spin);
  }
  requestAnimationFrame(spin);

  // ---- Background: perspective grid + data rain ----
  const cv = document.getElementById('bg'), ctx = cv.getContext('2d');
  let W, H, dpr, drops;
  const resize = () => {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = cv.width = innerWidth * dpr; H = cv.height = innerHeight * dpr;
    drops = Array.from({ length: Math.round(innerWidth / 28) }, () => ({
      x: Math.random() * W, y: Math.random() * H, s: Math.random() * 1.5 + .5, l: Math.random() * 80 + 40
    }));
  };
  resize(); addEventListener('resize', resize);

  const draw = time => {
    ctx.clearRect(0, 0, W, H);
    const hz = H * .62, cx = W / 2;

    const g = ctx.createLinearGradient(0, hz, 0, H);
    g.addColorStop(0, 'rgba(180,140,255,0)'); g.addColorStop(1, 'rgba(94,231,255,.25)');
    ctx.strokeStyle = g; ctx.lineWidth = dpr;
    for (let i = -28; i <= 28; i++) { ctx.beginPath(); ctx.moveTo(cx + i * 5 * dpr, hz); ctx.lineTo(cx + i * 150 * dpr, H); ctx.stroke(); }
    const off = reduce ? 0 : (time / 2500) % 1;
    for (let j = 0; j < 16; j++) {
      const p = Math.pow((j + off) / 16, 2.3), y = hz + p * (H - hz);
      ctx.globalAlpha = p; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    const glow = ctx.createRadialGradient(cx, hz, 0, cx, hz, W * .55);
    glow.addColorStop(0, 'rgba(255,122,168,.14)'); glow.addColorStop(.4, 'rgba(180,140,255,.08)'); glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);

    for (const d of drops) {
      if (!reduce) { d.y += d.s * 2 * dpr; if (d.y - d.l * dpr > H) { d.y = 0; d.x = Math.random() * W; } }
      const lg = ctx.createLinearGradient(0, d.y - d.l * dpr, 0, d.y);
      lg.addColorStop(0, 'rgba(94,231,255,0)'); lg.addColorStop(1, `rgba(94,231,255,${.12 * d.s})`);
      ctx.strokeStyle = lg; ctx.beginPath(); ctx.moveTo(d.x, d.y - d.l * dpr); ctx.lineTo(d.x, d.y); ctx.stroke();
    }
    if (!reduce) requestAnimationFrame(draw);
  };
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
